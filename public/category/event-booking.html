<!DOCTYPE html>
<html lang="en">
<head>
    <script src="../js/theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Varela&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <title>Event Booking</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/themes.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../category/css/events.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body { padding: 0; user-select: none; }
        .page-wrap { max-width: 1100px; margin: 170px auto 60px; padding: 0 20px;animation: fade-up 0.8s forwards; }
        .back-link { text-decoration: none; color: var(--color-fg); padding: 2px 10px; }
        .back-link:hover { background-color: var(--color-fg); color: var(--color-bg); }
        .booking-layout { display: grid; grid-template-columns: 210px 1fr; margin-top: 1rem; gap: -0.5rem; align-items: start; }
        .image-card { width: 190px; background: var(--color-bg); border: 1px solid var(--radio-border); border-radius: 10px; overflow: hidden; }
        .event-image { height: 325px; width: 100%; background-size: cover; background-position: center; }
        .booking-content { background: var(--color-bg); border: 1px solid var(--radio-border); border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 9px; }
        .booking-title { margin: 0; font-size: 1.2rem; color: var(--color-fg); }
        .meta { display: flex; flex-wrap: wrap; gap: 14px; color: var(--tnc-color); font-size: 0.9rem; }
        .meta span { display: inline-flex; align-items: center; gap: 6px; }
		.about { color: var(--tnc-color); font-size: 0.85rem; display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .availability { color: var(--tnc-color); font-size: 0.9rem; }
		.controls-lg { display: flex; align-items: center; gap: 14px; }
		.controls-lg label { color: var(--color-fg); font-weight: 600; letter-spacing: 0.3px; }
		.qty-controls { display: inline-flex; align-items: center; gap: 8px; }
		.qty-btn { background: var(--radio-color); color: var(--color-fg); border: 1px solid var(--radio-border); border-radius: 8px; padding: 10px; width: 40px; cursor: pointer; font-family: 'Varela', sans-serif; transition: 0.2s; }
		.qty-btn:hover { background: var(--color-fg); color: var(--color-bg); }
		.qty-btn:disabled { opacity: 0.6; cursor: not-allowed; }
		.qty-input-lg { appearance: none; width: 140px; padding: 10px; background: transparent; color: var(--color-fg); border: 1px solid var(--radio-border); border-radius: 8px; font-family: 'Space Mono', monospace; text-align: center; font-size: 1.05rem; }
        .price-row { display: flex; justify-content: space-between; align-items: center; background: var(--color-bh); border: 1px solid var(--radio-border); border-radius: 8px; padding: 12px 14px; }
        .price-row .label { color: var(--tnc-color); font-size: 0.9rem; }
        .price-row .value { color: var(--color-fg); font-weight: 700; }
        .actions { display: flex; margin-left: 54.4rem; width: 150%; }
        #total-price.total-flash { animation: totalFlash 1s ease; }
        @keyframes totalFlash {
            0% { color: var(--color-fg); text-shadow: none; }
            25% { color: var(--color-fg); text-shadow: 0 0 8px var(--color-fg), 0 0 10px var(--color-fg); }
            100% { color: var(--color-fg); text-shadow: none; }
        }
        @media (max-width: 900px) { .booking-layout { grid-template-columns: 1fr; } .image-card { width: 100%; max-width: 340px; } }
    </style>
    </head>
<body>
    <nav style="z-index: 1; background-color: transparent;backdrop-filter: blur(4px);">
        <a href="../index.html">TICKETEASE</a>
        <div id="user-info" style="display: none;">
            <span id="username-display"></span>
            <div class="dropdown">
                <button class="dropdown-btn" onclick="toggleDropdown()">▼</button>
                <div class="dropdown-content" id="dropdown-menu">
                    <a href="dashboard.html">Dashboard</a>
                    <a href="scanner/scanner-info.html">Scan Tickets</a>
                    <a href="#" onclick="logout()">Logout</a>
                </div>
            </div>
        </div>
        <div class="service-nav">
            <a href="../category/flights.html" data-icon="flight.svg">
                <i class="fas fa-plane"></i> FLIGHTS
            </a>
            <a href="../category/hotels.html" data-icon="hotel.svg">
                <i class="fas fa-hotel"></i> HOTELS
            </a>
            <a href="../category/trains.html" data-icon="train.svg">
                <i class="fas fa-train"></i> TRAINS
            </a>
            <a class="active" href="../category/events.html" data-icon="event.svg">
                <i class="fas fa-calendar-alt"></i> EVENTS
            </a>
        </div>
        <button id="login-btn" onclick="showPopup()">LOGIN / SIGNUP</button>
        <button id="theme-switch">
            <svg height="24px" viewBox="0 -960 960 960" width="24px" fill="#e8eaed">
                <path d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Z" />
            </svg>
            <svg height="24px" viewBox="0 -960 960 960" width="24px" fill="#e8eaed">
                <path d="M480-280q-83 0-141.5-58.5T280-480q0-83 58.5-141.5T480-680q83 0 141.5 58.5T680-480q0 83-58.5 141.5T480-280ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59ZM-98-212l101-97 55 53-97 101-59-57Z" />
            </svg>
        </button>
    </nav>

    <main class="page-wrap">
        <a class="back-link" href="../category/events.html">&larr; Back to Events</a>
        <div class="booking-layout">
            <div class="image-card">
                <div class="event-image" id="event-image"></div>
            </div>
            <div class="booking-content">
                <h1 class="booking-title" id="event-name">Event Name</h1>
                <div class="meta" id="event-meta"></div>
                <div class="about" id="event-description">Description</div>
                <div class="availability" id="availability"></div>
				<div class="controls-lg">
					<label for="qty">Tickets</label>
					<div class="qty-controls">
						<button type="button" class="qty-btn" id="qty-minus">-</button>
						<input id="qty" class="qty-input-lg" type="number" min="1" value="1">
						<button type="button" class="qty-btn" id="qty-plus">+</button>
					</div>
				</div>
                <div class="price-row">
                    <div class="label">Price per ticket</div>
                    <div class="value" id="per-price">-</div>
                </div>
                <div class="price-row">
                    <div class="label">Total</div>
                    <div class="value" id="total-price">-</div>
                </div>
            </div>
            <div class="actions">
                <button class="book-btn" id="book-btn">BOOK NOW</button>
                <button class="book-btn" id="cancel-btn">CANCEL</button>
            </div>
        </div>
    </main>

    <!-- Razorpay SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="../js/navbar.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const eventDataRaw = localStorage.getItem('selectedEvent');
            if (!eventDataRaw) { window.location.href = '../category/events.html'; return; }

            const eventData = JSON.parse(eventDataRaw);
            const perTicketPrice = (eventData.price === 'Free') ? 0 : (parseInt(String(eventData.price).replace(/[^0-9]/g, '')) || 0);

            const nameEl = document.getElementById('event-name');
            const metaEl = document.getElementById('event-meta');
            const descEl = document.getElementById('event-description');
            const availabilityEl = document.getElementById('availability');
            const qtyEl = document.getElementById('qty');
            const perPriceEl = document.getElementById('per-price');
            const totalEl = document.getElementById('total-price');
            const bookBtn = document.getElementById('book-btn');
            const cancelBtn = document.getElementById('cancel-btn');
			const minusBtn = document.getElementById('qty-minus');
			const plusBtn = document.getElementById('qty-plus');

            document.getElementById('event-image').style.backgroundImage = `url('../category/assets/events/${eventData.image || 'default.jpg'}')`;
            nameEl.textContent = eventData.name;
            const formattedDate = new Date(eventData.date).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
            metaEl.innerHTML = `
                <span><i class=\"far fa-calendar-alt\"></i> ${formattedDate}</span>
                <span><i class=\"far fa-clock\"></i> ${eventData.start_time} - ${eventData.end_time}</span>
                <span><i class=\"fas fa-map-marker-alt\"></i> ${eventData.location}</span>
                <span><i class=\"fas fa-tag\"></i> ${eventData.price}</span>
                <span><i class=\"fas fa-layer-group\"></i> ${(eventData.category || '').toUpperCase()}</span>
            `;
            descEl.textContent = eventData.description || '';

            // Availability & limits
            const available = Number(eventData.available_tickets);
            const unlimited = available === -1 || isNaN(available);
            if (!unlimited) {
                qtyEl.max = Math.max(available, 0);
                availabilityEl.textContent = available > 0 ? `${available} tickets remaining` : 'Sold out';
            } else {
                availabilityEl.textContent = 'Tickets Available';
            }

            function updateTotals() {
                let qty = parseInt(qtyEl.value || '1', 10);
                if (qty < 1) qty = 1;
                if (!unlimited && available >= 0) qty = Math.min(qty, available);
                qtyEl.value = qty;
                perPriceEl.textContent = (perTicketPrice === 0) ? 'Free' : eventData.price;
                const total = perTicketPrice * qty;

                const nextText = (perTicketPrice === 0) ? 'Free' : `₹${total.toLocaleString('en-IN')}`;
                if (totalEl.textContent !== nextText) {
                    totalEl.classList.remove('total-flash');

                    void totalEl.offsetWidth;
                    totalEl.textContent = nextText;
                    totalEl.classList.add('total-flash');
                    setTimeout(() => totalEl.classList.remove('total-flash'), 1000);
                } else {
                    totalEl.textContent = nextText;
                }
                bookBtn.disabled = (!unlimited && available <= 0);
                if (bookBtn.disabled) bookBtn.classList.add('disabled');
            }

			qtyEl.addEventListener('input', updateTotals);
			minusBtn.addEventListener('click', function () {
				let qty = parseInt(qtyEl.value || '1', 10);
				qty = Math.max(1, qty - 1);
				qtyEl.value = qty;
				updateTotals();
			});
			plusBtn.addEventListener('click', function () {
				let qty = parseInt(qtyEl.value || '1', 10);
				const max = isNaN(parseInt(qtyEl.max)) ? Infinity : parseInt(qtyEl.max);
				qty = Math.min(max, qty + 1);
				qtyEl.value = qty;
				updateTotals();
			});
            updateTotals();

            bookBtn.addEventListener('click', function () {
                if (bookBtn.disabled) return;
                initiatePayment();
            });

            cancelBtn.addEventListener('click', function () {
                window.location.href = '../category/events.html';
            });

            // Razorpay Payment Integration
            window.initiatePayment = function() {
                const qty = parseInt(qtyEl.value || '1', 10);
                const totalAmount = perTicketPrice * qty;

                if (totalAmount === 0) {
                    // Free event - no payment needed
                    handleFreeEventBooking();
                    return;
                }

                const options = {
                    key: 'rzp_test_RARdpJpmGuxtwo', // Replace with your Razorpay Test Key ID
                    amount: totalAmount * 100, // Amount in paise (multiply by 100)
                    currency: 'INR',
                    name: 'Ticketease',
                    description: `Event Booking: ${eventData.name}`,
                    image: '../images/favicon.png', // Your logo
                    order_id: '', // Optional: Generate order_id from backend
                    handler: function (response) {
                        // Payment successful
                        console.log('Payment successful:', response);
                        handlePaymentSuccess(response, qty, totalAmount);
                    },
                    prefill: {
                        name: 'Customer Name', // You can get this from user session
                        email: 'customer@example.com',
                        contact: '9999999999'
                    },
                    notes: {
                        event_name: eventData.name,
                        event_date: eventData.date,
                        event_location: eventData.location,
                        ticket_quantity: qty,
                        price_per_ticket: perTicketPrice,
                        booking_date: new Date().toISOString()
                    },
                    theme: {
                        color: '#000000' // Your brand color
                    },
                    modal: {
                        ondismiss: function () {
                            console.log('Payment modal closed');
                            showAlert('Payment cancelled', 'error');
                        }
                    }
                };

                const rzp = new Razorpay(options);

                rzp.on('payment.failed', function (response) {
                    console.log('Payment failed:', response.error);
                    handlePaymentFailure(response.error, qty, totalAmount);
                });

                rzp.open();
            };

            function handleFreeEventBooking() {
                const qty = parseInt(qtyEl.value || '1', 10);
                
                // Store booking details for free events
                const bookingData = {
                    event_details: eventData,
                    ticket_quantity: qty,
                    total_amount: 0,
                    booking_date: new Date().toISOString(),
                    status: 'confirmed',
                    type: 'event',
                    payment_required: false
                };

                localStorage.setItem('bookingData', JSON.stringify(bookingData));
                showAlert('Free event booked successfully! Redirecting...', 'success');

                // Redirect to success page after 2 seconds
                setTimeout(() => {
                    window.location.href = '../payment-status.html?status=success&type=event&free=true';
                }, 2000);
            }

            function handlePaymentSuccess(response, qty, totalAmount) {
                // Store payment details
                const paymentData = {
                    razorpay_payment_id: response.razorpay_payment_id,
                    razorpay_order_id: response.razorpay_order_id,
                    razorpay_signature: response.razorpay_signature,
                    amount: totalAmount,
                    event_details: eventData,
                    ticket_quantity: qty,
                    booking_date: new Date().toISOString(),
                    status: 'success',
                    type: 'event'
                };

                localStorage.setItem('paymentData', JSON.stringify(paymentData));

                // Show success message
                showAlert('Payment successful! Redirecting to confirmation...', 'success');

                // Redirect to success page after 2 seconds
                setTimeout(() => {
                    window.location.href = '../payment-status.html?status=success&type=event';
                }, 2000);
            }

            function handlePaymentFailure(error, qty, totalAmount) {
                console.error('Payment failed:', error);

                const errorData = {
                    error_code: error.code,
                    error_description: error.description,
                    error_source: error.source,
                    error_step: error.step,
                    error_reason: error.reason,
                    amount: totalAmount,
                    event_details: eventData,
                    ticket_quantity: qty,
                    booking_date: new Date().toISOString(),
                    status: 'failed',
                    type: 'event'
                };

                localStorage.setItem('paymentError', JSON.stringify(errorData));

                showAlert(`Payment failed: ${error.description}`, 'error');

                // Optionally redirect to failure page
                setTimeout(() => {
                    window.location.href = '../payment-status.html?status=failed&type=event';
                }, 3000);
            }

            // Custom alert function
            function showAlert(message, type = 'info') {
                const alertBox = document.createElement('div');
                alertBox.className = `alert show ${type}`;
                alertBox.innerHTML = `<span>${message}</span>`;
                alertBox.style.cssText = `
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    padding: 15px 25px;
                    background-color: ${type === 'success' ? '#4CAF50' : type === 'error' ? '#f44336' : '#2196F3'};
                    color: white;
                    border-radius: 4px;
                    z-index: 10000;
                    font-family: 'Space Mono', monospace;
                    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
                `;

                document.body.appendChild(alertBox);

                setTimeout(() => {
                    alertBox.remove();
                }, 5000);
            }
        });
    </script>
</body>
</html>
