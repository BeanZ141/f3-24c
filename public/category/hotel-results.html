            <label class="filter-checkbox-label">

            </label>
            <label class="filter-checkbox-label">
                <input class="filter-checkbox airline-filter" type="checkbox" value="Room Service">
                <span>Room Service</span>
                <span>(05)</span>
            </label>
            <label class="filter-checkbox-label">
                <input class="filter-checkbox airline-filter" type="checkbox" value="Breakfast Included">
                <span>Breakfast</span>
                <span>(09)</span>
            </label>
            <label class="filter-checkbox-label">
                <input class="filter-checkbox airline-filter" type="checkbox" value="Pay at Hotel">

            <label class="filter-checkbox-label">

    <div class="hotel-card-center">

            <div class="sort-option" onclick="sortFlights('departure')">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        document.querySelectorAll('.rate-value').forEach(el => {
            const rating = parseFloat(el.getAttribute('data-rating'));
            if (rating <= 3.9) {
                el.style.color = 'red';
            } else if (rating <= 6.5) {
                el.style.color = 'orange';
            } else {
                el.style.color = 'green';
            }
        });
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const filters = {
                    location: urlParams.get('location'),
                    rating: urlParams.get('rating'),
                    minPrice: urlParams.get('minPrice'),
                    maxPrice: urlParams.get('maxPrice')
                };

                const data = await DatabaseService.getHotels(filters);
                allHotelsData = [...data];
                renderHotelCards(data);
                updateHotelFilterCounts(data);
            } catch (error) {
                console.error('Error fetching hotels:', error);
            }
        });

        function getRatingColor(rating) {
            rating = parseFloat(rating);
            if (rating >= 6.6) return 'green';
            if (rating >= 4.0) return 'orange';
            return 'red';
        }

        function renderHotelCards(data) {
            const container = document.querySelector('.hotel-cards');
            container.innerHTML = '';

            data.forEach(hotel => {
                const features = (hotel.features || '').split(';').map(f => `<span>${f.trim()}</span>`).join('');
                const ratingColor = getRatingColor(hotel.rating);

                const cardHTML = `
                <div class="hotel-card" onclick="showDetails(this)" data-price="${hotel.price}" data-rating="${hotel.rating}">
                    <div class="hotel-info">
                        <div class="hotel-image">
                            <img src="${hotel.image}" alt="Hotel Image">
                        </div>
                        <div class="info-group">
                            <div class="company">
                                <h4 class="hotel-name">${hotel.name}</h4>
                                <p class="hotel-location">${hotel.location}</p>
                            </div>
                            <div class="rating">
                                <span class="label rate-value" style="color:${ratingColor}"><b>${hotel.rating}</b></span> 
                                <span class="label">Exceptional • ${hotel.reviews} reviews</span>
                            </div>
                            <div class="features">
                                ${features}
                            </div>
                        </div>
                        <div class="rating-book-btn-group">
                            <div class="price">
                                <h3 class="hotel-cost">₹${hotel.price}</h3>
                                <p class="hotel-offer">${hotel.offer}</p>
                            </div>
                            <button class="book-btn" onclick="storeHotelDetails(this)">BOOK</button>
                        </div>
                    </div>
                </div>
            `;
                container.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        function storeHotelDetails(button) {
            const card = button.closest('.hotel-card');
            const hotelDetails = {
                name: card.querySelector('.hotel-name').textContent,
                location: card.querySelector('.hotel-location').textContent,
                rating: card.querySelector('.rate-value b').textContent,
                cost: card.querySelector('.hotel-cost').textContent,
                offer: card.querySelector('.hotel-offer').textContent
            };
            localStorage.setItem('selectedHotel', JSON.stringify(hotelDetails));
            window.location.href = 'hotel-booking.html';
        }

        let allHotelsData = [];

        async function applyHotelFilters() {
            const selectedAmenities = Array.from(document.querySelectorAll('.airline-filter:checked')).map(cb => cb.value);

            let filteredData = [...allHotelsData];

            if (selectedAmenities.length > 0) {
                filteredData = filteredData.filter(hotel => {
                    const hotelFeatures = (hotel.features || '').toLowerCase();
                    return selectedAmenities.every(amenity =>
                        hotelFeatures.includes(amenity.toLowerCase())
                    );
                });
            }

            renderHotelCards(filteredData);
        }

        function updateHotelFilterCounts(data) {
            // Update amenity filter counts
            const amenityCounts = {};

            data.forEach(hotel => {
                const features = (hotel.features || '').split(';');
                features.forEach(feature => {
                    const cleanFeature = feature.trim();
                    if (cleanFeature) {
                        amenityCounts[cleanFeature] = (amenityCounts[cleanFeature] || 0) + 1;
                    }
                });
            });
        }

        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.filter-checkbox').forEach(checkbox => {
                checkbox.addEventListener('change', applyHotelFilters);
            });
        });
    </script>

    <script type="module" src="../js/login-signup.js"></script>
