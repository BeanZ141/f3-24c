<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="../css/themes.css">
    <link rel="stylesheet" href="../css/navbar.css">

    <script src="../js/auth.js"></script>
    <script src="../js/database.js"></script>
    <link rel="stylesheet" href="../category/css/hotel-results.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <nav style="z-index: 1; background-color: transparent;backdrop-filter: blur(4px);">
        <a href="../index.html" style="font-family: 'Cormorant Garamond', serif;">TICKETEASE</a>
        <div id="user-info" style="display: none;">
            <span id="username-display"></span>
            <div class="dropdown">
                <button class="dropdown-btn" onclick="toggleDropdown()">▼</button>
                <div class="dropdown-content" id="dropdown-menu">
                    <a href="dashboard.html">Dashboard</a>
                    <a href="#" onclick="logout()">Logout</a>
                </div>
            </div>
        </div>

        <!--Service section-->
        <div class="service-nav">
            <a href="../category/flights.html" data-icon="flight.svg">
                <i class="fas fa-plane"></i> FLIGHTS
            </a>
            <a class="active" href="../category/hotels.html" data-icon="hotel.svg">
                <i class="fas fa-hotel"></i> HOTELS</a>
            <a href="../category/trains.html" data-icon="train.svg">
                <i class="fas fa-train"></i> TRAINS
            </a>
            <a href="../category/events.html" data-icon="event.svg">
                <i class="fas fa-calendar-alt"></i> EVENTS
            </a>
        </div>

        <button id="theme-switch">
            <svg height="24px" viewBox="0 -960 960 960" width="24px" fill="#e8eaed"> <path d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Z" /> </svg>
            <svg height="24px" viewBox="0 -960 960 960" width="24px" fill="#e8eaed"> <path d="M480-280q-83 0-141.5-58.5T280-480q0-83 58.5-141.5T480-680q83 0 141.5 58.5T680-480q0 83-58.5 141.5T480-280ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59Zm-98-550 97-101 59 57-100 96-56-52ZM154-212l101-97 55 53-97 101-59-57Z" /></svg>
        </button>
        
        <button id="login-btn" onclick="showPopup()">LOGIN / SIGNUP</button>
    </nav>

    <div class="category-image" style="position:fixed;top:7vh;left:1vw;width:1830px;height:855px;
                    background-image:linear-gradient(to bottom,#0000 50%,#000c 100%),url(../images/hotels_1.jpg);
    background-size:cover;background-position:center;border-radius:20px;display:flex;align-items:flex-end;
    padding:25px;font-size:2.5rem;font-weight:700;letter-spacing:2px;color:#fff;z-index:0;
    box-shadow:0 20px 40px #0000004d;animation:slide-in 1s ease-out forwards">HOTELS</div>

    <!-- Filter section -->
    <div class="filter-section">
        <h3 class="filter-title">Filters</h3>
        <hr class="filter-divider">

        <div class="filter-group">
            <p class="filter-category">Amenities</p>
            <label class="filter-checkbox-label">
                <input class="filter-checkbox amenity-filter" type="checkbox" value="Free Wi-Fi">
                <span>Free Wi-Fi</span>
                <span class="count" id="count-wifi">(0)</span>
            </label>
            <label class="filter-checkbox-label">
                <input class="filter-checkbox amenity-filter" type="checkbox" value="Swimming pool">
                <span>Swimming Pool</span>
                <span class="count" id="count-pool">(0)</span>
            </label>
            <label class="filter-checkbox-label">
                <input class="filter-checkbox amenity-filter" type="checkbox" value="Spa">
                <span>Spa & Wellness</span>
                <span class="count" id="count-spa">(0)</span>
            </label>
            <label class="filter-checkbox-label">
                <input class="filter-checkbox amenity-filter" type="checkbox" value="Gym">
                <span>Fitness Center</span>
                <span class="count" id="count-gym">(0)</span>
            </label>
            <label class="filter-checkbox-label">
                <input class="filter-checkbox amenity-filter" type="checkbox" value="Fine Dining">
                <span>Fine Dining</span>
                <span class="count" id="count-dining">(0)</span>
            </label>
            <label class="filter-checkbox-label">
                <input class="filter-checkbox amenity-filter" type="checkbox" value="Parking">
                <span>Parking</span>
                <span class="count" id="count-parking">(0)</span>
            </label>
        </div>
    </div>

    <div class="hotel-card-center">
        <!-- Sort By -->
        <div class="sort-container">
            <div class="sort-option active" data-sort="reset" onclick="handleSort(this, 'reset')">
                <span class="sort-title">Custom</span>
                <span class="sort-subtitle">Initial search</span>
            </div>
            <div class="sort-option" data-sort="price-low" onclick="handleSort(this, 'price-low')">
                <span class="sort-title">Price</span>
                <span class="sort-subtitle">Low to High</span>
            </div>
            <div class="sort-option" data-sort="all" onclick="handleSort(this, 'all')">
                <span class="sort-title">All</span>
                <span class="sort-subtitle">Available</span>
            </div>
            <div class="sort-option" data-sort="rating" onclick="handleSort(this, 'rating')">
                <span class="sort-title">Rating</span>
                <span class="sort-subtitle">Top Rated</span>
            </div>
        </div>

        <!-- Hotel Cards -->
        <div class="hotel-cards"></div>
    </div>

    <!-- Details Section -->
    <div class="details-panel" id="details-panel">
        <button class="close-btn" onclick="closeDetails()">CLOSE</button>
        <h2>Hotel Details</h2>
        <div id="hotel-details-content">
            <p>More information about the hotel will go here...</p>
        </div>
    </div>


    <script>
        let initialSearchData = []; // Data matching URL params
        let masterListData = [];    // ALL hotels from DB
        let activeDataSource = [];  // Current source for filters/display
        let currentSort = 'reset';

        document.addEventListener('DOMContentLoaded', async function () {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const searchFilters = {
                    location: urlParams.get('location'),
                    rating: urlParams.get('rating'),
                    minPrice: urlParams.get('minPrice'),
                    maxPrice: urlParams.get('maxPrice')
                };

                // Fetch both: Initial search result AND complete list
                [initialSearchData, masterListData] = await Promise.all([
                    DatabaseService.getHotels(searchFilters),
                    DatabaseService.getHotels({})
                ]);

                // Default is Initial Search
                activeDataSource = [...initialSearchData];
                
                applyAllFiltersAndSort();
                updateHotelFilterCounts(activeDataSource);
                
                document.querySelectorAll('.amenity-filter').forEach(cb => {
                    cb.addEventListener('change', applyAllFiltersAndSort);
                });

            } catch (error) {
                console.error('Error initializing hotels:', error);
            }
        });

        function getRatingColor(rating) {
            rating = parseFloat(rating);
            if (rating >= 9.0) return '#00aa6c';
            if (rating >= 7.0) return '#72a0c1';
            return '#ff5a5f';
        }

        function renderHotelCards(data) {
            const container = document.querySelector('.hotel-cards');
            container.innerHTML = '';

            if (data.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding: 50px; color: var(--tnc-color);">No hotels found matching these criteria.</div>';
                return;
            }

            data.forEach(hotel => {
                const features = (hotel.features || '').split(';').map(f => `<span>${f.trim()}</span>`).join('');
                const ratingColor = getRatingColor(hotel.rating);

                const cardHTML = `
                <div class="hotel-card" onclick="showDetails(this)" data-price="${hotel.price}" data-rating="${hotel.rating}">
                    <div class="hotel-info">
                        <div class="hotel-image">
                            <img src="${hotel.image}" alt="${hotel.name}">
                        </div>
                        <div class="info-group">
                            <div class="company">
                                <h4 class="hotel-name">${hotel.name}</h4>
                                <p class="hotel-location">${hotel.location}</p>
                            </div>
                            <div class="rating">
                                <span class="label rate-value" style="color:${ratingColor}"><b>${hotel.rating}</b></span> 
                                <span class="label">${getRatingText(hotel.rating)} • ${hotel.reviews} reviews</span>
                            </div>
                            <div class="features">
                                ${features}
                            </div>
                        </div>
                        <div class="rating-book-btn-group">
                            <div class="price">
                                <h3 class="hotel-cost">₹${hotel.price.toLocaleString('en-IN')}</h3>
                                <p class="hotel-offer">${hotel.offer || '+ ₹1,200 taxes & fees'}</p>
                            </div>
                            <button class="book-btn" onclick="event.stopPropagation(); storeHotelDetails(this)">BOOK</button>
                        </div>
                    </div>
                </div>
            `;
                container.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        function getRatingText(rating) {
            const r = parseFloat(rating);
            if (r >= 9.0) return 'Exceptional';
            if (r >= 8.5) return 'Superb';
            if (r >= 8.0) return 'Fabulous';
            if (r >= 7.0) return 'Very Good';
            return 'Good';
        }

        function handleSort(element, sortType) {
            document.querySelectorAll('.sort-option').forEach(opt => opt.classList.remove('active'));
            element.classList.add('active');
            
            // Switch data source if "all" or "reset" is chosen
            if (sortType === 'all') {
                activeDataSource = [...masterListData];
            } else if (sortType === 'reset') {
                activeDataSource = [...initialSearchData];
            }
            
            currentSort = sortType;
            applyAllFiltersAndSort();
            updateHotelFilterCounts(activeDataSource);
        }

        function applyAllFiltersAndSort() {
            const selectedAmenities = Array.from(document.querySelectorAll('.amenity-filter:checked')).map(cb => cb.value.toLowerCase());

            let result = [...activeDataSource];

            // 1. Filter
            if (selectedAmenities.length > 0) {
                result = result.filter(hotel => {
                    const hotelFeatures = (hotel.features || '').toLowerCase();
                    return selectedAmenities.every(amenity => hotelFeatures.includes(amenity));
                });
            }

            // 2. Sort
            if (currentSort === 'price-low') {
                result.sort((a, b) => a.price - b.price);
            } else if (currentSort === 'rating') {
                result.sort((a, b) => b.rating - a.rating);
            }

            renderHotelCards(result);
        }

        function updateHotelFilterCounts(data) {
            const counts = {
                'wifi': 0,
                'pool': 0,
                'spa': 0,
                'gym': 0,
                'dining': 0,
                'parking': 0
            };

            data.forEach(hotel => {
                const features = (hotel.features || '').toLowerCase();
                if (features.includes('wi-fi') || features.includes('wifi')) counts.wifi++;
                if (features.includes('pool')) counts.pool++;
                if (features.includes('spa')) counts.spa++;
                if (features.includes('gym') || features.includes('fitness')) counts.gym++;
                if (features.includes('fine dining') || features.includes('restaurant')) counts.dining++;
                if (features.includes('parking')) counts.parking++;
            });

            document.getElementById('count-wifi').innerText = `(${counts.wifi})`;
            document.getElementById('count-pool').innerText = `(${counts.pool})`;
            document.getElementById('count-spa').innerText = `(${counts.spa})`;
            document.getElementById('count-gym').innerText = `(${counts.gym})`;
            document.getElementById('count-dining').innerText = `(${counts.dining})`;
            document.getElementById('count-parking').innerText = `(${counts.parking})`;
        }

        function bookHotel(hotel) {
            localStorage.setItem('selectedHotel', JSON.stringify(hotel));
            window.location.href = 'hotel-booking.html';
        }

        function storeHotelDetails(btn) {
            const card = btn.closest('.hotel-card');
            const searchDetails = JSON.parse(localStorage.getItem('hotelSearchDetails') || '{}');
            
            const hotelDetails = {
                name: card.querySelector('.hotel-name').textContent,
                location: card.querySelector('.hotel-location').textContent,
                price: parseInt(card.querySelector('.hotel-cost').textContent.replace(/[^0-9]/g, '')),
                offer: card.querySelector('.hotel-offer')?.textContent || '',
                image: card.querySelector('.hotel-image img').src,
                rating: card.getAttribute('data-rating'),
                // Merge search parameters
                checkIn: searchDetails.checkIn || '15 Mar\'25',
                checkOut: searchDetails.checkOut || '17 Mar\'25',
                guests: searchDetails.guests || 2,
                rooms: searchDetails.rooms || 1,
                nights: searchDetails.nights || 2
            };
            localStorage.setItem('selectedHotel', JSON.stringify(hotelDetails));
            window.location.href = 'hotel-booking.html';
        }

        function showDetails(card) {
            const detailsPanel = document.getElementById('details-panel');
            const content = document.getElementById('hotel-details-content');
            
            const hotelName = card.querySelector('.hotel-name').textContent;
            const hotelLocation = card.querySelector('.hotel-location').textContent;
            const hotelPrice = card.querySelector('.hotel-cost').textContent;
            const imgUrl = card.querySelector('.hotel-image img').src;
            
            content.innerHTML = `
                <img src="${imgUrl}" style="width: 100%; height: 200px; object-fit: cover; margin-bottom: 20px;">
                <h3 style="margin-bottom: 10px;">${hotelName}</h3>
                <p style="color: #666; margin-bottom: 15px;">${hotelLocation}</p>
                <p style="font-weight: 500; font-size: 1.2rem; margin-bottom: 20px;">${hotelPrice}</p>
            `;
            
            detailsPanel.classList.add('active');
        }

        function closeDetails() {
            document.getElementById('details-panel').classList.remove('active');
        }

        document.addEventListener('DOMContentLoaded', function () {
            // Additional listeners if needed
        });
    </script>
    <script src="../js/navbar.js"></script>
</body>

</html>
