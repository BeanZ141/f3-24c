    <!-- Filter section -->
    <div class="filter-section">
        <h3 class="filter-title">Filters</h3>
        <hr class="filter-divider">

        <div class="filter-group">
            <!-- Date Filters -->
            <p class="filter-category">Date</p>
            <label class="filter-checkbox-label">
                <input class="filter-checkbox date-filter" type="checkbox" value="Today">
                <span>Today</span>
                <span>[12]</span>
            </label>
            <label class="filter-checkbox-label">
                <input class="filter-checkbox date-filter" type="checkbox" value="Tomorrow">
                <span>Tomorrow</span>
                <span>[18]</span>
            </label>
            <label class="filter-checkbox-label">
                <input class="filter-checkbox date-filter" type="checkbox" value="This Weekend">
                <span>This Weekend</span>
                <span>[18]</span>
            </label>
            <!-- Price Filters -->
            <p class="filter-category">Price</p>
            <label class="filter-checkbox-label">
                <input class="filter-checkbox price-filter" type="checkbox" value="Free">
                <span>Free</span>
                <span>[02]</span>
            </label>
            <label class="filter-checkbox-label">
                <input class="filter-checkbox price-filter" type="checkbox" value="0-500">
                <span>0 - 500</span>
                <span>[05]</span>
            </label>
            <label class="filter-checkbox-label">
                <input class="filter-checkbox price-filter" type="checkbox" value="501-2000">
                <span>501 - 2000</span>
                <span>[05]</span>
            </label>
            <label class="filter-checkbox-label">
                <input class="filter-checkbox price-filter" type="checkbox" value="Above 2000">
                <span>Above 2000</span>
                <span>[06]</span>
            </label>
        </div>
    </div>

    <!-- Event Categories -->
    <div class="category-container">
        <div class="category-option active" onclick="filterEvents('reset')">
            <span class="category-title">Unfiltered</span>
        </div>
        <div class="category-option" onclick="filterEvents('comedy')">
            <span class="category-title">Comedy Shows</span>
        </div>
        <div class="category-option" onclick="filterEvents('workshops')">
            <span class="category-title">Workshops</span>
        </div>
        <div class="category-option" onclick="filterEvents('music')">
            <span class="category-title">Music Shows</span>
        </div>
        <div class="category-option" onclick="filterEvents('exhibitions')">
            <span class="category-title">Exhibitions</span>
        </div>
        <div class="category-option" onclick="filterEvents('conferences')">
            <span class="category-title">Conferences</span>
        </div>
    </div>

    <!-- Event Cards -->
    <div class="event-cards"></div>

    <!-- Details Section -->
    <div class="details-panel" id="details-panel">
        <button class="close-btn" onclick="closeDetails()">CLOSE</button>
        <div class="event-details-content"></div> <!-- This is the container we need -->
    </div>

    <script src="/public/js/navbar.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            let originalEventData = [];
            let currentFilter = 'reset';

            fetch('/public/category/events.csv')
                .then(response => response.text())
                .then(csvText => {
                    const results = Papa.parse(csvText, {
                        header: true,
                        skipEmptyLines: true
                    });
                    originalEventData = processCSVData(results.data);
                    updateFilterCounts();
                    renderEventCards(originalEventData);
                })
                .catch(error => {
                    console.error('Error loading events:', error);
                    loadMockData();
                });

            function processCSVData(data) {
                return data.map(event => ({
                    ...event,
                    priceValue: event.price === "Free" ? 0 : parseInt(event.price.replace(/[^0-9]/g, '')) || 0,
                    dateCategory: getDateCategory(event.date),
                    formattedDate: formatDate(event.date)
                }));
            }

            function getDateCategory(dateStr) {
                const today = new Date();
                const eventDate = new Date(dateStr);
                const tomorrow = new Date();
                tomorrow.setDate(today.getDate() + 1);

                if (eventDate.toDateString() === today.toDateString()) return "Today";
                if (eventDate.toDateString() === tomorrow.toDateString()) return "Tomorrow";

                if (eventDate.getDay() === 6 || eventDate.getDay() === 0) {
                    const thisWeekend = new Date(today);
                    thisWeekend.setDate(today.getDate() + (6 - today.getDay())); // Next Saturday
                    const nextWeekend = new Date(thisWeekend);
                    nextWeekend.setDate(thisWeekend.getDate() + 7);

                    if (eventDate >= thisWeekend && eventDate < nextWeekend) {
                        return "This Weekend";
                    }
                }
                return "";
            }

            function formatDate(dateStr) {
                const options = { weekday: 'short', month: 'short', day: 'numeric' };
                return new Date(dateStr).toLocaleDateString('en-US', options);
            }

            function updateFilterCounts() {
                document.querySelectorAll('.date-filter').forEach(filter => {
                    const value = filter.value;
                    const count = originalEventData.filter(event => event.dateCategory === value).length;
                    const countSpan = filter.nextElementSibling.nextElementSibling;
                    if (countSpan) countSpan.textContent = `[${count}]`;
                });

                document.querySelectorAll('.price-filter').forEach(filter => {
                    const value = filter.value;
                    let count = 0;

                    if (value === "Free") {
                        count = originalEventData.filter(event => event.price === "Free").length;
                    }
                    else if (value === "0-500") {
                        count = originalEventData.filter(event => event.priceValue > 0 && event.priceValue <= 500).length;
                    }
                    else if (value === "501-2000") {
                        count = originalEventData.filter(event => event.priceValue > 500 && event.priceValue <= 2000).length;
                    }
                    else if (value === "Above 2000") {
                        count = originalEventData.filter(event => event.priceValue > 2000).length;
                    }

                    const countSpan = filter.nextElementSibling.nextElementSibling;
                    if (countSpan) countSpan.textContent = `[${count}]`;
                });
            }

            function renderEventCards(data) {
                const eventCardsContainer = document.querySelector('.event-cards');
                eventCardsContainer.innerHTML = '';

                if (data.length === 0) {
                    eventCardsContainer.innerHTML = '<div class="no-events">No events found matching your filters.</div>';
                    return;
                }

                data.forEach(event => {
                    const cardHTML = `
            <div class="event-card" onclick="showEventDetails(${event.id})" 
                data-category="${event.category}"
                data-date="${event.dateCategory}"
                data-price="${event.priceValue}">
                <div class="event-image" style="background-image: url('/public/category/assets/events/${event.image || 'default.jpg'}')"></div>
                <div class="event-info">
                    <h4 class="event-name">${event.name}</h4>
                    <p class="event-price">${event.price}</p>
                </div>
                <button class="book-btn" onclick="event.stopPropagation(); storeEventDetails(${event.id})">BOOK</button>
            </div>
            `;
                    eventCardsContainer.insertAdjacentHTML('beforeend', cardHTML);
                });
            }

            function filterEvents(filterOption) {
                document.querySelectorAll('.category-option').forEach(option => {
                    option.classList.remove('active');
                });

                event.currentTarget.classList.add('active');
                currentFilter = filterOption;
                applyFilters();
            }

            function applyFilters() {
                const selectedDates = Array.from(document.querySelectorAll('.date-filter:checked')).map(cb => cb.value);
                const selectedPrices = Array.from(document.querySelectorAll('.price-filter:checked')).map(cb => cb.value);

                let filteredData = originalEventData;

                if (currentFilter !== 'reset') { filteredData = filteredData.filter(event => event.category === currentFilter); }
                if (selectedDates.length > 0) { filteredData = filteredData.filter(event => selectedDates.includes(event.dateCategory)); }
                if (selectedPrices.length > 0) {
                    filteredData = filteredData.filter(event => {
                        if (selectedPrices.includes("Free") && event.price === "Free") return true;
                        if (selectedPrices.includes("0-500") && event.priceValue > 0 && event.priceValue <= 500) return true;
                        if (selectedPrices.includes("501-2000") && event.priceValue > 500 && event.priceValue <= 2000) return true;
                        if (selectedPrices.includes("Above 2000") && event.priceValue > 2000) return true;
                        return false;
                    });
                }

                renderEventCards(filteredData);
            }

            function showEventDetails(eventId) {
                const event = originalEventData.find(e => e.id == eventId);
                if (!event) return;

                const detailsPanel = document.getElementById('details-panel');
                const content = detailsPanel.querySelector('.event-details-content');

                content.innerHTML = `
            <h2>${event.name}</h2>
            <div class="event-meta">
                <p><i class="fas fa-map-marker-alt"></i> <strong>Location:</strong> ${event.location}</p>
                <p><i class="far fa-calendar-alt"></i> <strong>Date:</strong> ${event.formattedDate}</p>
                <p><i class="far fa-clock"></i> <strong>Time:</strong> ${event.start_time} - ${event.end_time}</p>
                <p><i class="fas fa-tag"></i> <strong>Price:</strong> ${event.price}</p>
                ${event.available_tickets > 0 || event.available_tickets == -1 ?
                        `<p><i class="fas fa-ticket-alt"></i> <strong>Tickets:</strong> ${event.available_tickets == -1 ? 'Available' : `${event.available_tickets} remaining`}</p>` :
                        '<p class="sold-out">SOLD OUT</p>'}
            </div>
            <div class="event-description">
                <h3>About the Event</h3>
                <p>${event.description}</p>
            </div>
            ${event.available_tickets > 0 || event.available_tickets == -1 ?
                        `<button class="book-btn" onclick="storeEventDetails(${event.id})">BOOK NOW</button>` :
                        '<button class="book-btn disabled" disabled>SOLD OUT</button>'}
        `;

                detailsPanel.classList.add('active');
            }

            function storeEventDetails(eventId) {
                const event = originalEventData.find(e => e.id == eventId);
                if (!event) return;

                localStorage.setItem('selectedEvent', JSON.stringify(event));
                window.location.href = '/public/category/event-booking.html';
            }

            function closeDetails() { document.getElementById('details-panel').classList.remove('active'); }


            document.querySelectorAll('.filter-checkbox').forEach(checkbox => {
                checkbox.addEventListener('change', applyFilters);
            });

            window.filterEvents = filterEvents;
            window.showEventDetails = showEventDetails;
            window.storeEventDetails = storeEventDetails;
            window.closeDetails = closeDetails;
        });
    </script>
