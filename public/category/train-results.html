<!DOCTYPE html>
<html lang="en">

<head>
    <script src="../js/theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Varela&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>Train Search Results</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/themes.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../category/css/flight-results.css">
</head>

<body>
    <nav style="z-index: 1; background-color: transparent;backdrop-filter: blur(4px);">
        <a href="../index.html">TICKETEASE</a>
        <div id="user-info" style="display: none;">
            <span id="username-display"></span>
            <div class="dropdown">
                <button class="dropdown-btn" onclick="toggleDropdown()">▼</button>
                <div class="dropdown-content" id="dropdown-menu">
                    <a href="../dashboard.html">Dashboard</a>
                    <a href="../scanner/scanner-info.html">Scan Tickets</a>
                    <a href="#" onclick="logout()">Logout</a>
                </div>
            </div>
        </div>

        <!--Service section-->
        <div class="service-nav">
            <a href="../category/flights.html" data-icon="flight.svg">
                <i class="fas fa-plane"></i> FLIGHTS
            </a>
            <a href="../category/hotels.html" data-icon="hotel.svg">
                <i class="fas fa-hotel"></i> HOTELS
            </a>
            <a class="active" href="../category/trains.html" data-icon="train.svg">
                <i class="fas fa-train"></i> TRAINS
            </a>
            <a href="../category/events.html" data-icon="event.svg">
                <i class="fas fa-calendar-alt"></i> EVENTS
            </a>
        </div>
        <button id="login-btn" onclick="showPopup()">LOGIN / SIGNUP</button>

        <button id="theme-switch">
            <svg height="24px" viewBox="0 -960 960 960" width="24px" fill="#e8eaed">
                <path
                    d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Z" />
            </svg>
            <svg height="24px" viewBox="0 -960 960 960" width="24px" fill="#e8eaed">
                <path
                    d="M480-280q-83 0-141.5-58.5T280-480q0-83 58.5-141.5T480-680q83 0 141.5 58.5T680-480q0 83-58.5 141.5T480-280ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59Zm-98-550 97-101 59 57-100 96-56-52ZM154-212l101-97 55 53-97 101-59-57Z" />
            </svg>
        </button>
    </nav>

    <!-- Filter section -->
    <div class="filter-section">
        <h3 class="filter-title">Filters</h3>
        <hr class="filter-divider">

        <div class="filter-group">
            <!-- Stops -->
            <p class="filter-category">Stops</p>
            <label class="filter-checkbox-label">
                <input class="filter-checkbox stop-filter" type="checkbox" value="Direct">
                <span>Direct</span>
                <span>[0]</span>
            </label>
            <label class="filter-checkbox-label">
                <input class="filter-checkbox stop-filter" type="checkbox" value="1 Stop">
                <span>1 Stop</span>
                <span>[0]</span>
            </label>
            <label class="filter-checkbox-label">
                <input class="filter-checkbox stop-filter" type="checkbox" value="2 Stops">
                <span>2 Stops</span>
                <span>[0]</span>
            </label>
            <!-- Train Companies -->
            <p class="filter-category">Train Companies</p>
            <label class="filter-checkbox-label">
                <input class="filter-checkbox company-filter" type="checkbox" value="Indian Railways">
                <span>Indian Railways</span>
                <span>[0]</span>
            </label>
            <label class="filter-checkbox-label">
                <input class="filter-checkbox company-filter" type="checkbox" value="IRCTC Tejas">
                <span>IRCTC Tejas</span>
                <span>[0]</span>
            </label>
            <label class="filter-checkbox-label">
                <input class="filter-checkbox company-filter" type="checkbox" value="Vande Bharat">
                <span>Vande Bharat</span>
                <span>[0]</span>
            </label>
        </div>
    </div>

    <div class="flight-card-center">
        <!-- Sort By -->
        <div class="sort-container">
            <div class="sort-option active" onclick="sortTrains('reset')">
                <span class="sort-title">Custom</span>
                <span class="sort-subtitle">Initial search</span>
            </div>
            <div class="sort-option" onclick="sortTrains('price')">
                <span class="sort-title">Price</span>
                <span class="sort-subtitle">Low to High</span>
            </div>
            <div class="sort-option" onclick="sortTrains('duration')">
                <span class="sort-title">Fastest</span>
                <span class="sort-subtitle">Shortest First</span>
            </div>
            <div class="sort-option" onclick="sortTrains('departure')">
                <span class="sort-title">Departure</span>
                <span class="sort-subtitle">Earliest First</span>
            </div>
        </div>

        <!-- Train Cards -->
        <div class="flight-cards"></div>
    </div>

    <!-- Details Section -->
    <div class="details-panel" id="details-panel">
        <button class="close-btn" onclick="closeDetails()">CLOSE</button>
        <h2>Train Details</h2>
        <p>More information about the train will go here...</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/database.js"></script>
    <script src="../js/navbar.js"></script>
    <script>
        let originalTrainData = [];

        document.addEventListener('DOMContentLoaded', async function () {
            try {
                // Get URL parameters for filtering
                const urlParams = new URLSearchParams(window.location.search);
                const filters = {
                    from: urlParams.get('from'),
                    to: urlParams.get('to'),
                    company: urlParams.get('company') ? [urlParams.get('company')] : null,
                    stops: urlParams.get('stops') ? [urlParams.get('stops')] : null
                };

                // Fetch trains from database
                const data = await DatabaseService.getTrains(filters);
                originalTrainData = [...data];
                renderTrainCards(data);

                // Update filter counts
                updateFilterCounts(data);
            } catch (error) {
                console.error('Error fetching trains:', error);
                showAlert('Error loading trains. Please try again.', 'error');
            }
        });

        function renderTrainCards(data) {
            const trainCardsContainer = document.querySelector('.flight-cards');
            trainCardsContainer.innerHTML = '';

            data.forEach(train => {
                const cardHTML = `
                <div class="flight-card" onclick="showDetails(this)" 
                    data-price="${parseInt(train.cost.replace(/[^0-9]/g, ''))}"
                    data-duration="${getDurationInMinutes(train.duration)}"
                    data-departure="${getTimeInMinutes(train.departure)}">
                    <div class="flight-info">
                        <div class="company">
                            <h4 class="flight-company">${train.company}</h4>
                            <p class="flight-number">${train.train_number}</p>
                        </div>
                        <div class="time">
                            <p class="boarding-time">${train.departure}</p>
                            <p class="boarding-airport">${train.boarding_station}</p>
                        </div>
                        <div class="duration">
                            <p class="flight-duration">${train.duration}</p>
                            <span class="line"></span>
                            <p class="flight-stops">${train.stops}</p>
                        </div>
                        <div class="time">
                            <p class="landing-time">${train.arrival}</p>
                            <p class="landing-airport">${train.arrival_station}</p>
                        </div>
                        <div class="price">
                            <h3 class="flight-cost">${train.cost}</h3>
                            <p class="flight-offer">${train.offer}</p>
                        </div>
                        <button class="book-btn" onclick="storeTrainDetails(this)">BOOK</button>
                    </div>
                </div>
            `;
                trainCardsContainer.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        function getDurationInMinutes(duration) {
            const [hours, minutes] = duration.split('h').map(part => parseInt(part.replace('m', '').trim()) || 0);
            return (hours * 60) + minutes;
        }

        function getTimeInMinutes(time) {
            const [hours, minutes] = time.split(':').map(part => parseInt(part));
            return (hours * 60) + minutes;
        }

        function sortTrains(sortOption) {
            document.querySelectorAll('.sort-option').forEach(option => {
                option.classList.remove('active');
            });

            event.currentTarget.classList.add('active');

            const trainCardsContainer = document.querySelector('.flight-cards');

            if (sortOption === 'reset') {
                renderTrainCards(originalTrainData);
                return;
            }

            const trainCards = Array.from(trainCardsContainer.children);

            trainCards.sort((a, b) => {
                const valueA = parseInt(a.dataset[sortOption]);
                const valueB = parseInt(b.dataset[sortOption]);
                return valueA - valueB;
            });

            trainCards.forEach(card => {
                card.classList.remove('fade-card');
            });

            setTimeout(() => {
                trainCardsContainer.innerHTML = '';
                trainCards.forEach(card => {
                    trainCardsContainer.appendChild(card);
                    requestAnimationFrame(() => {
                        card.classList.add('fade-card');
                    });
                });
            });
        }

        function storeTrainDetails(button) {
            const card = button.closest('.flight-card');

            const trainDetails = {
                company: card.querySelector('.flight-company').textContent,
                trainNumber: card.querySelector('.flight-number').textContent,
                departureTime: card.querySelector('.boarding-time').textContent,
                departureStation: card.querySelector('.boarding-airport').textContent,
                duration: card.querySelector('.flight-duration').textContent,
                stops: card.querySelector('.flight-stops').textContent,
                arrivalTime: card.querySelector('.landing-time').textContent,
                arrivalStation: card.querySelector('.landing-airport').textContent,
                cost: card.querySelector('.flight-cost').textContent
            };

            localStorage.setItem('selectedTrain', JSON.stringify(trainDetails));
            window.location.href = './train-booking.html';
        }

        function showDetails(card) {
            const detailsPanel = document.getElementById('details-panel');

            if (detailsPanel.classList.contains('active')) {
                closeDetails();
            }

            document.removeEventListener('click', closeOnOutsideClick);

            const company = card.querySelector('.flight-company')?.textContent || 'N/A';
            const trainNumber = card.querySelector('.flight-number')?.textContent || 'N/A';
            const departureTime = card.querySelector('.boarding-time')?.textContent || 'N/A';
            const trainDuration = card.querySelector('.flight-duration')?.textContent || 'N/A';
            const arrivalTime = card.querySelector('.landing-time')?.textContent || 'N/A';
            const trainStops = card.querySelector('.flight-stops')?.textContent || 'N/A';
            const trainCost = card.querySelector('.flight-cost')?.textContent || 'N/A';
            const departureStation = card.querySelector('.boarding-airport')?.textContent || 'N/A';
            const arrivalStation = card.querySelector('.landing-airport')?.textContent || 'N/A';

            detailsPanel.innerHTML = `
                <button class="close-btn" onclick="closeDetails(event)">CLOSE</button>
                <h2>Train Details</h2>
                <div class="flight-details">
                    <div class="details-row">
                        <span class="details-label">Railway Company :</span>
                        <span class="details-value">${company}</span>
                    </div>
                    <div class="details-row">
                        <span class="details-label">Train Number :</span>
                        <span class="details-value">${trainNumber}</span>
                    </div>
                    <div class="details-row">
                        <span class="details-label">Departure Time :</span>
                        <span class="details-value">${departureTime}</span>
                    </div>
                    <div class="details-row">
                        <span class="details-label">Departure Station :</span>
                        <span class="details-value">${departureStation}</span>
                    </div>
                    <div class="details-row">
                        <span class="details-label">Journey Duration :</span>
                        <span class="details-value">${trainDuration}</span>
                    </div>
                    <div class="details-row">
                        <span class="details-label">Arrival Time :</span>
                        <span class="details-value">${arrivalTime}</span>
                    </div>
                    <div class="details-row">
                        <span class="details-label">Arrival Station :</span>
                        <span class="details-value">${arrivalStation}</span>
                    </div>
                    <div class="details-row">
                        <span class="details-label">Stops :</span>
                        <span class="details-value">${trainStops}</span>
                    </div>
                    <div class="details-row">
                        <span class="details-label">Cost :</span>
                        <span class="details-value">${trainCost}</span>
                    </div>
                </div>
            `;

            detailsPanel.classList.add('active');

            setTimeout(() => {
                document.addEventListener('click', closeOnOutsideClick);
            }, 100);
        }

        function closeDetails(event) {
            if (event) event.stopPropagation();
            const detailsPanel = document.getElementById('details-panel');
            detailsPanel.classList.remove('active');
            document.removeEventListener('click', closeOnOutsideClick);
        }

        function closeOnOutsideClick(event) {
            const detailsPanel = document.getElementById('details-panel');
            if (detailsPanel.classList.contains('active') && !detailsPanel.contains(event.target)) {
                closeDetails(event);
            }
        }

        // Filter functionality
        document.querySelectorAll('.filter-checkbox').forEach(checkbox => {
            checkbox.addEventListener('change', applyFilters);
        });

        let currentSortType = 'reset';

        async function applyFilters() {
            const selectedStops = Array.from(document.querySelectorAll('.stop-filter:checked')).map(cb => cb.value);
            const selectedCompanies = Array.from(document.querySelectorAll('.company-filter:checked')).map(cb => cb.value);

            // Get URL parameters for base filters
            const urlParams = new URLSearchParams(window.location.search);
            const baseFilters = {
                from: urlParams.get('from'),
                to: urlParams.get('to')
            };

            // Add checkbox filters
            const filters = {
                ...baseFilters,
                stops: selectedStops.length > 0 ? selectedStops : null,
                company: selectedCompanies.length > 0 ? selectedCompanies : null
            };

            try {
                let filteredData = await DatabaseService.getTrains(filters);

                // Apply client-side sorting
                filteredData.sort((a, b) => {
                    switch (currentSortType) {
                        case 'price':
                            return DatabaseService.parsePrice(a.cost) - DatabaseService.parsePrice(b.cost);
                        case 'duration':
                            return DatabaseService.getDurationInMinutes(a.duration) - DatabaseService.getDurationInMinutes(b.duration);
                        case 'departure':
                            return DatabaseService.getTimeInMinutes(a.departure) - DatabaseService.getTimeInMinutes(b.departure);
                        case 'reset':
                        default:
                            return 0;
                    }
                });

                renderTrainCards(filteredData);
            } catch (error) {
                console.error('Error applying filters:', error);
                showAlert('Error applying filters. Please try again.', 'error');
            }
        }

        function updateFilterCounts(data) {
            // Update stop filter counts
            const stopCounts = {};
            const companyCounts = {};

            data.forEach(train => {
                stopCounts[train.stops] = (stopCounts[train.stops] || 0) + 1;
                companyCounts[train.company] = (companyCounts[train.company] || 0) + 1;
            });

            // Update stop filter labels
            document.querySelectorAll('.stop-filter').forEach(checkbox => {
                const count = stopCounts[checkbox.value] || 0;
                const label = checkbox.parentElement;
                const countSpan = label.querySelector('span:last-child');
                if (countSpan) {
                    countSpan.textContent = `[${count}]`;
                }
            });

            // Update company filter labels
            document.querySelectorAll('.company-filter').forEach(checkbox => {
                const count = companyCounts[checkbox.value] || 0;
                const label = checkbox.parentElement;
                const countSpan = label.querySelector('span:last-child');
                if (countSpan) {
                    countSpan.textContent = `[${count}]`;
                }
            });
        }

        // Custom alert function
        function showAlert(message, type = 'info') {
            const alertBox = document.getElementById('customAlert');
            const alertMessage = document.getElementById('alertMessage');
            if (alertBox && alertMessage) {
                alertMessage.innerText = message;
                alertBox.className = `alert show ${type}`;
                setTimeout(() => alertBox.classList.remove('show'), 5000);
            } else {
                alert(message);
            }
        }
    </script>

    <!--Alert-->
    <div id="customAlert" class="alert"><span id="alertMessage">alert</span></div>

</body>

</html>
