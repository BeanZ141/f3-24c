<head>

<body>
    <nav style="z-index: 1; background-color: transparent;backdrop-filter: blur(4px);">
        <a href="../index.html" style="font-family: 'Cormorant Garamond', serif;">TICKETEASE</a>
        <div id="user-info" style="display: none;">
            <span id="username-display"></span>
            <div class="dropdown">
                <button class="dropdown-btn" onclick="toggleDropdown()">▼</button>
                <div class="dropdown-content" id="dropdown-menu">
                    <a href="../dashboard.html">Dashboard</a>
                    <a href="#" onclick="logout()">Logout</a>
                </div>
            </div>
        </div>

        <!--Service section-->
        <div class="service-nav">
            <a href="../category/flights.html" data-icon="flight.svg">
                <i class="fas fa-plane"></i> FLIGHTS
            </a>
            <a href="../category/hotels.html" data-icon="hotel.svg">
                <i class="fas fa-hotel"></i> HOTELS
            </a>
            <a class="active" href="../category/trains.html" data-icon="train.svg">
                <i class="fas fa-train"></i> TRAINS
            </a>
            <a href="../category/events.html" data-icon="event.svg">
                <i class="fas fa-calendar-alt"></i> EVENTS
            </a>
        </div>
        <button id="login-btn" onclick="showPopup()">LOGIN / SIGNUP</button>

        <button id="theme-switch">
            <svg height="24px" viewBox="0 -960 960 960" width="24px" fill="#e8eaed">
                <path
                    d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Z" />
            </svg>
            <svg height="24px" viewBox="0 -960 960 960" width="24px" fill="#e8eaed">
                <path
                    d="M480-280q-83 0-141.5-58.5T280-480q0-83 58.5-141.5T480-680q83 0 141.5 58.5T680-480q0 83-58.5 141.5T480-280ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59Zm-98-550 97-101 59 57-100 96-56-52ZM154-212l101-97 55 53-97 101-59-57Z" />
            </svg>
        </button>
    </nav>

    <div class="category-image" style="position:fixed;top:7vh;left:1vw;width:1830px;height:855px;
                    background-image:linear-gradient(to bottom,#0000 50%,#000c 100%),url(../images/train_1.jpg);
    background-size:cover;background-position:center;border-radius:20px;display:flex;align-items:flex-end;
    padding:25px;font-size:2.5rem;font-weight:700;letter-spacing:2px;color:#fff;z-index:0;
    box-shadow:0 20px 40px #0000004d;animation:slide-in 1s ease-out forwards">HOTELS</div>

    <!-- Filter section -->
    <div class="filter-section">
        <h3 class="filter-title">Filters</h3>
        <hr class="filter-divider">

        <div class="filter-group">
            <!-- Stops -->
            <p class="filter-category">Stops</p>
            <label class="filter-checkbox-label">
                <input class="filter-checkbox stop-filter" type="checkbox" value="Direct">
                <span>Direct</span>
                <span>[0]</span>
            </label>
            <label class="filter-checkbox-label">
                <input class="filter-checkbox stop-filter" type="checkbox" value="1 Stop">
                <span>1 Stop</span>
                <span>[0]</span>
            </label>
            <label class="filter-checkbox-label">
                <input class="filter-checkbox stop-filter" type="checkbox" value="2 Stops">
                <span>2 Stops</span>
                <span>[0]</span>
            </label>
            <!-- Train Companies -->
            <p class="filter-category">Train Companies</p>
            <label class="filter-checkbox-label">
                <input class="filter-checkbox company-filter" type="checkbox" value="Indian Railways">
                <span>Indian Railways</span>
                <span>[0]</span>
            </label>
            <label class="filter-checkbox-label">
                <input class="filter-checkbox company-filter" type="checkbox" value="IRCTC Tejas">
                <span>IRCTC Tejas</span>
                <span>[0]</span>
            </label>
            <label class="filter-checkbox-label">
                <input class="filter-checkbox company-filter" type="checkbox" value="Vande Bharat">
                <span>Vande Bharat</span>
                <span>[0]</span>
            </label>
        </div>
    </div>

    <div class="flight-card-center">
        <!-- Sort By -->
        <div class="sort-container">
            <div class="sort-option active" data-sort="reset" onclick="handleSort(this, 'reset')">
                <span class="sort-title">Custom</span>
                <span class="sort-subtitle">Initial search</span>
            </div>
            <div class="sort-option" data-sort="price" onclick="handleSort(this, 'price')">
                <span class="sort-title">Price</span>
                <span class="sort-subtitle">Low to High</span>
            </div>
            <div class="sort-option" data-sort="all" onclick="handleSort(this, 'all')">
                <span class="sort-title">All</span>
                <span class="sort-subtitle">Available</span>
            </div>
            <div class="sort-option" data-sort="duration" onclick="handleSort(this, 'duration')">
                <span class="sort-title">Fastest</span>
                <span class="sort-subtitle">Shortest First</span>
            </div>
            <div class="sort-option" data-sort="departure" onclick="handleSort(this, 'departure')">
                <span class="sort-title">Departure</span>
                <span class="sort-subtitle">Earliest First</span>
            </div>
        </div>

        <!-- Train Cards -->
        <div class="flight-cards"></div>
    </div>

    <!-- Details Section -->
    <div class="details-panel" id="details-panel">
        <button class="close-btn" onclick="closeDetails()">CLOSE</button>
        <h2>Train Details</h2>
        <p>More information about the train will go here...</p>
    </div>

    <script>
        let initialSearchData = []; 
        let masterListData = [];    
        let activeDataSource = [];  
        let currentSortType = 'reset';

        document.addEventListener('DOMContentLoaded', async function () {
            try {
                // Get URL parameters for filtering
                const urlParams = new URLSearchParams(window.location.search);
                const filters = {
                    from: urlParams.get('from'),
                    to: urlParams.get('to'),
                    company: urlParams.get('company') ? [urlParams.get('company')] : null,
                    stops: urlParams.get('stops') ? [urlParams.get('stops')] : null
                };

                // Fetch both initial search result and absolute complete list
                [initialSearchData, masterListData] = await Promise.all([
                    DatabaseService.getTrains(filters),
                    DatabaseService.getTrains({})
                ]);

                // Default is Initial Search
                activeDataSource = [...initialSearchData];
                
                applyFiltersAndSort();
                updateFilterCounts(activeDataSource);
                
                document.querySelectorAll('.filter-checkbox').forEach(checkbox => {
                    checkbox.addEventListener('change', applyFiltersAndSort);
                });

            } catch (error) {
                console.error('Error fetching trains:', error);
                showAlert('Error loading trains. Please try again.', 'error');
            }
        });

        function renderTrainCards(data) {
            const trainCardsContainer = document.querySelector('.flight-cards');
            trainCardsContainer.innerHTML = '';

            if (data.length === 0) {
                trainCardsContainer.innerHTML = '<div style="text-align:center; padding: 50px; color: var(--tnc-color);">No trains found matching these criteria.</div>';
                return;
            }

            data.forEach(train => {
                const cardHTML = `
                <div class="flight-card" onclick="showDetails(this)" 
                    data-price="${DatabaseService.parsePrice(train.cost)}"
                    data-duration="${DatabaseService.getDurationInMinutes(train.duration)}"
                    data-departure="${DatabaseService.getTimeInMinutes(train.departure)}">
                    <div class="flight-info">
                        <div class="company">
                            <h4 class="flight-company">${train.company}</h4>
                            <p class="flight-number">${train.train_number}</p>
                        </div>
                        <div class="time">
                            <p class="boarding-time">${train.departure}</p>
                            <p class="boarding-airport">${train.boarding_station}</p>
                        </div>
                        <div class="duration">
                            <p class="flight-duration">${train.duration}</p>
                            <span class="line"></span>
                            <p class="flight-stops">${train.stops}</p>
                        </div>
                        <div class="time">
                            <p class="landing-time">${train.arrival}</p>
                            <p class="landing-airport">${train.arrival_station}</p>
                        </div>
                        <div class="price">
                            <h3 class="flight-cost">${train.cost}</h3>
                            <p class="flight-offer">${train.offer}</p>
                        </div>
                        <button class="book-btn" onclick="event.stopPropagation(); storeTrainDetails(this)">BOOK</button>
                    </div>
                </div>
            `;
                trainCardsContainer.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        function handleSort(element, sortOption) {
            document.querySelectorAll('.sort-option').forEach(option => {
                option.classList.remove('active');
            });
            element.classList.add('active');

            // Switch data source if "all" or "reset" is chosen
            if (sortOption === 'all') {
                activeDataSource = [...masterListData];
            } else if (sortOption === 'reset') {
                activeDataSource = [...initialSearchData];
            }

            currentSortType = sortOption;
            applyFiltersAndSort();
            updateFilterCounts(activeDataSource);
        }

        async function applyFiltersAndSort() {
            const selectedStops = Array.from(document.querySelectorAll('.stop-filter:checked')).map(cb => cb.value);
            const selectedCompanies = Array.from(document.querySelectorAll('.company-filter:checked')).map(cb => cb.value);

            let result = [...activeDataSource];

            // 1. Filter
            if (selectedStops.length > 0) {
                result = result.filter(train => selectedStops.includes(train.stops));
            }
            if (selectedCompanies.length > 0) {
                result = result.filter(train => selectedCompanies.includes(train.company));
            }

            // 2. Sort
            result.sort((a, b) => {
                const costA = DatabaseService.parsePrice(a.cost);
                const costB = DatabaseService.parsePrice(b.cost);
                const durA = DatabaseService.getDurationInMinutes(a.duration);
                const durB = DatabaseService.getDurationInMinutes(b.duration);
                const depA = DatabaseService.getTimeInMinutes(a.departure);
                const depB = DatabaseService.getTimeInMinutes(b.departure);

                switch (currentSortType) {
                    case 'price':
                        return costA - costB;
                    case 'duration':
                        return durA - durB;
                    case 'departure':
                        return depA - depB;
                    case 'all':
                    case 'reset':
                    default:
                        return 0; // Maintain original database ordering (which acts as Custom)
                }
            });

            renderTrainCards(result);
        }

        function updateFilterCounts(data) {
            const stopCounts = {};
            const companyCounts = {};

            data.forEach(train => {
                stopCounts[train.stops] = (stopCounts[train.stops] || 0) + 1;
                companyCounts[train.company] = (companyCounts[train.company] || 0) + 1;
            });

            document.querySelectorAll('.stop-filter').forEach(checkbox => {
                const count = stopCounts[checkbox.value] || 0;
                const label = checkbox.parentElement;
                const countSpan = label.querySelector('span:last-child');
                if (countSpan) countSpan.textContent = `[${count}]`;
            });

            document.querySelectorAll('.company-filter').forEach(checkbox => {
                const count = companyCounts[checkbox.value] || 0;
                const label = checkbox.parentElement;
                const countSpan = label.querySelector('span:last-child');
                if (countSpan) countSpan.textContent = `[${count}]`;
            });
        }

        function storeTrainDetails(button) {
            const card = button.closest('.flight-card');
            const trainDetails = {
                company: card.querySelector('.flight-company').textContent,
                train_number: card.querySelector('.flight-number').textContent,
                departure: card.querySelector('.boarding-time').textContent,
                boarding_station: card.querySelector('.boarding-airport').textContent,
                duration: card.querySelector('.flight-duration').textContent,
                stops: card.querySelector('.flight-stops').textContent,
                arrival: card.querySelector('.landing-time').textContent,
                arrival_station: card.querySelector('.landing-airport').textContent,
                cost: card.querySelector('.flight-cost').textContent,
                offer: card.querySelector('.flight-offer').textContent
            };
            localStorage.setItem('selectedTrain', JSON.stringify(trainDetails));
            window.location.href = './train-booking.html';
        }

        function showDetails(card) {
            const detailsPanel = document.getElementById('details-panel');
            if (detailsPanel.classList.contains('active')) {
                closeDetails();
            }

            document.removeEventListener('click', closeOnOutsideClick);

            const trainDetails = {
                company: card.querySelector('.flight-company')?.textContent || 'N/A',
                trainNumber: card.querySelector('.flight-number')?.textContent || 'N/A',
                departureTime: card.querySelector('.boarding-time')?.textContent || 'N/A',
                duration: card.querySelector('.flight-duration')?.textContent || 'N/A',
                arrival: card.querySelector('.landing-time')?.textContent || 'N/A',
                stops: card.querySelector('.flight-stops')?.textContent || 'N/A',
                cost: card.querySelector('.flight-cost')?.textContent || 'N/A',
                from: card.querySelector('.boarding-airport')?.textContent || 'N/A',
                to: card.querySelector('.landing-airport')?.textContent || 'N/A'
            };

            detailsPanel.innerHTML = `
                <button class="close-btn" onclick="closeDetails(event)">CLOSE</button>
                <h2>Train Details</h2>
                <div class="flight-details">
                    <div class="details-row"><span class="details-label">Railway Company :</span><span class="details-value">${trainDetails.company}</span></div>
                    <div class="details-row"><span class="details-label">Train Number :</span><span class="details-value">${trainDetails.trainNumber}</span></div>
                    <div class="details-row"><span class="details-label">Departure :</span><span class="details-value">${trainDetails.departureTime} (${trainDetails.from})</span></div>
                    <div class="details-row"><span class="details-label">Journey Duration :</span><span class="details-value">${trainDetails.duration}</span></div>
                    <div class="details-row"><span class="details-label">Arrival :</span><span class="details-value">${trainDetails.arrival} (${trainDetails.to})</span></div>
                    <div class="details-row"><span class="details-label">Stops :</span><span class="details-value">${trainDetails.stops}</span></div>
                    <div class="details-row"><span class="details-label">Cost :</span><span class="details-value">${trainDetails.cost}</span></div>
                </div>
            `;

            detailsPanel.classList.add('active');
            setTimeout(() => document.addEventListener('click', closeOnOutsideClick), 100);
        }

        function closeDetails(event) {
            if (event) event.stopPropagation();
            document.getElementById('details-panel').classList.remove('active');
            document.removeEventListener('click', closeOnOutsideClick);
        }

        function closeOnOutsideClick(event) {
            const panel = document.getElementById('details-panel');
            if (panel.classList.contains('active') && !panel.contains(event.target)) {
                closeDetails(event);
            }
        }

        function showAlert(message, type = 'info') {
            const alertBox = document.getElementById('customAlert');
            const alertMessage = document.getElementById('alertMessage');
            if (alertBox && alertMessage) {
                alertMessage.innerText = message;
                alertBox.className = `alert show ${type}`;
                setTimeout(() => alertBox.classList.remove('show'), 5000);
            } else {
                alert(message);
            }
        }
    </script>

    <!--Alert-->
    <div id="customAlert" class="alert"><span id="alertMessage">alert</span></div>

    <script src="../js/navbar.js"></script>
</body>


</html>
