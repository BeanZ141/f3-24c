<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/public/css/styles.css">
    <link rel="stylesheet" href="/public/css/themes.css">
    <link rel="stylesheet" href="/public/css/book-ticket.css">
    <link rel="stylesheet" href="/public/css/navbar.css">
    <link href="https://fonts.googleapis.com/css2?family=Varela&display=swap" rel="stylesheet">
    <title>Book Ticket</title>
</head>
<body>
    <div class="container">
        <h1>BOOK YOUR TICKET</h1>

        <form id="ticketForm" class="form">
            <div class="form-group"><input type="text" id="name" name="name" placeholder="Name" required></div>
            <div class="form-group"><input type="email" id="email" name="email" placeholder="Email Address" required></div>
            <div class="form-group"><input type="tel" id="phone" name="phone" placeholder="Phone Number" pattern="[0-9]{10}" required></div>

            <div class="form-group">
                <p>Select Event Date:</p>
                <div class="date-selection">
                    <input type="radio" id="date1" name="dateOfAttendance" value="10-12-2024" required><label for="date1">10 / 12 / 2024</label>
                    <input type="radio" id="date2" name="dateOfAttendance" value="11-12-2024" required><label for="date2">11 / 12 / 2024</label>
                </div>
            </div>

            <p style="font-size: 0.9em;text-align: center;margin-top: -10px;margin-bottom: 20px;">The phone number and email collected are used for authentication purposes. These details allow us to send information for ticket confirmation.</p>

            <div class="form-group"><p class="ticket-price">Ticket Price: <span style="background-color: var(--color-fg); color: var(--color-bg); padding: 2px 5px;">₹10</span></p></div>
            <div class="form-group"><button type="submit" class="btn-primary">PROCEED TO PAYMENT</button></div>
        </form>
    </div>

    <button id="theme-switch">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e8eaed"><path d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Z"/></svg>
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e8eaed"><path d="M480-280q-83 0-141.5-58.5T280-480q0-83 58.5-141.5T480-680q83 0 141.5 58.5T680-480q0 83-58.5 141.5T480-280ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59Zm-98-550 97-101 59 57-100 96-56-52ZM154-212l101-97 55 53-97 101-59-57Z"/></svg>
      </button>

    <script src="/node_modules/@supabase/supabase-js/dist/umd/supabase.js"></script>

    <script type="module" src="/public/js/book-ticket.js"></script>
    <script src="/public/js/navbar.js"></script>

</body>
</html>
