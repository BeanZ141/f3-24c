<!DOCTYPE html>
<html>
  <head>
    <script>
      const setTheme = () => {
          const theme = localStorage.getItem('theme') || 'light';
          document.documentElement.classList.toggle('dark-mode', theme === 'dark');
      };
      setTheme();
  </script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <link rel="stylesheet" href="css/themes.css">
    <title>Page Not Found</title>

    <style media="screen">
      body {user-select: none; background: var(--color-bg); color: var(--color-fg); font-family: Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; }
      #message { background: var(--color-bg); max-width: 360px; margin: 100px auto 16px; padding: 32px 24px 16px; border-radius: 5px; }
      #message h3 { color: #000000; font-weight: normal; font-size: 16px; margin: 16px 0 12px; }
      #message h2 { color: #ffa100; font-weight: bold; font-size: 16px; margin: 0 0 8px; }
      #message h1 { font-size: 22px; font-weight: 300; color: #000000; margin: 0 0 16px;}
      #message p { line-height: 140%; margin: 16px 0 24px; font-size: 14px; }
      #message a { display: block; text-align: center; background: #039be5; text-transform: uppercase; text-decoration: none; color: var(--color-fg); padding: 16px; border-radius: 4px; }
      #load { color: rgba(0,0,0,0.4); text-align: center; font-size: 13px; }
      @media (max-width: 600px) {
        body, #message { margin-top: 0; background: var(--color-bg); box-shadow: none; }
        body { border-top: 16px solid #ffa100; }
      }
    </style>
  </head>
  <body>
    <div id="message">
      <h2>404</h2>
      <h1>Page Not Found</h1>
      <p>The specified file was not found on this website. Please check the URL for mistakes and try again.</p>
    </div>
  </body>
</html>
