<html lang="en">

<head>
  <script src="js/theme.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link rel="icon" href="images/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Varela&display=swap">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Unna:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/login-popup.css">
  <title>Project f3-24c</title>
</head>

<body>
  <!-- Splash Screen -->
  <div id="splash-screen"><div class="splash-text">TICKETEASE</div></div>

  <div id="main-content">
    <nav>
      <a href="../index.html">TICKETEASE</a>
      <div id="user-info" style="display: none;">
        <span id="username-display"></span>
        <div class="dropdown">
          <button class="dropdown-btn" onclick="toggleDropdown()">▼</button>
          <div class="dropdown-content" id="dropdown-menu">
            <a href="dashboard.html">Dashboard</a>
            <a href="scanner/scanner-info.html">Scan Tickets</a>
            <a href="#" onclick="logout()">Logout</a>
          </div>
        </div>
      </div>

      <button id="theme-switch">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e8eaed">
          <path d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Z" />
        </svg>
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e8eaed">
          <path d="M480-280q-83 0-141.5-58.5T280-480q0-83 58.5-141.5T480-680q83 0 141.5 58.5T680-480q0 83-58.5 141.5T480-280ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59Zm-98-550 97-101 59 57-100 96-56-52ZM154-212l101-97 55 53-97 101-59-57Z" />
        </svg>
      </button>
      <button id="login-btn" onclick="showPopup()">LOGIN / SIGNUP</button>
    </nav>

    <div class="services-grid">
      <a href="./category/flights.html" class="service flights">Flights</a>
      <a href="./category/hotels.html" class="service hotels">Hotels</a>
      <a href="./category/trains.html" class="service trains">Trains</a>
      <a href="./category/events.html" class="service events">Events</a>
    </div>

    <!-- Login / Signup Popup -->
    <div id="overlay"></div>
    <div id="login-popup" class="login-modal">
      <button type="button" class="close-button" onclick="closePopup()">&times;</button>

      <!-- LOGIN FORM -->
      <div class="form-toggle">
        <label>
          <input type="radio" name="formType" id="radioLogin" checked onclick="showLoginForm()">
          <span class="toggle-btn">LOGIN<h5 style="position: absolute;color: var(--radio-color);margin-left: 3.2rem;margin-top: -3rem;font-size: 2.2em;font-family: 'Inter';">.</h5></span>
        </label>
        <label>
          <input type="radio" name="formType" id="radioSignup" onclick="showSignupForm()">
          <span class="toggle-btn">SIGN UP<h5 style="position: absolute;color: var(--radio-color);margin-left: 4.1rem;margin-top: -3rem;font-size: 2.2em;font-family: 'Inter';">.</h5></span>
        </label>
      </div>
      <form id="loginForm" class="form">
        <h4 style="animation: fade-in 0.4s;font-family: 'Varela';">LOGIN</h4>
        <div class="form-group input-wrapper">
          <input type="email" id="login-email" name="email" placeholder="Email Address" required
            oninput="toggleClearButton(this)" onblur="toggleClearButton(this)">
          <button type="button" class="clear-btn" onclick="clearInput(this)">&times;</button>
        </div>
        <div class="form-group input-wrapper">
          <input type="password" id="login-password" name="password" placeholder="Password" required
            oninput="toggleClearButton(this)" onblur="toggleClearButton(this)">
          <button type="button" class="clear-btn" onclick="clearInput(this)">&times;</button>
        </div>
        <button type="submit" class="btn-primary">LOGIN</button>
      </form>

      <!-- SIGNUP FORM -->
      <form id="signupForm" class="form" style="display: none;">
        <h4 style="animation: fade-in 0.4s;font-family: 'Varela';">SIGN UP</h4>
        <div class="form-group input-wrapper">
          <input type="text" id="signup-username" name="username" placeholder="Username" required
            oninput="toggleClearButton(this)" onblur="toggleClearButton(this)">
          <button type="button" class="clear-btn" onclick="clearInput(this)">&times;</button>
        </div>
        <div class="form-group input-wrapper">
          <input type="email" id="signup-email" name="email" placeholder="Email Address" required
            oninput="toggleClearButton(this)" onblur="toggleClearButton(this)">
          <button type="button" class="clear-btn" onclick="clearInput(this)">&times;</button>
        </div>
        <div class="form-group input-wrapper">
          <input type="password" id="signup-password" name="password" placeholder="Password" required
            oninput="toggleClearButton(this)" onblur="toggleClearButton(this)">
          <button type="button" class="clear-btn" onclick="clearInput(this)">&times;</button>
        </div>
        <label class="container1 text-loading-animation">I agree to the <a class="text-loading-animation"
            href="terms-and-conditions.html">terms and conditions.</a>
          <input type="checkbox" required>
          <span class="checkmark"></span>
        </label>
        <button type="submit" class="btn-primary">SIGN UP</button>
      </form>
    </div>

    <a href="terms-and-conditions.html" class="tnc-link">TERMS AND CONDITIONS</a>
    <a href="about-us.html" class="ab-us-link">ABOUT US</a>

    <div id="customAlert" class="alert"><span id="alertMessage">alert</span></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="js/login-signup.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
