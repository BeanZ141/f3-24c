<html>

<head>
    <title>Check In</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Varela&display=swap" />
    <script src="/node_modules/html5-qrcode/html5-qrcode.min.js"></script>
    <script src="/node_modules/@supabase/supabase-js/dist/umd/supabase.js"></script>
    <link rel="stylesheet" href="scanner.css">
    <script src="/public/scanner/scanner.js"></script>
    <script src="/supabase.js"></script>
</head>

<body>
    <div id="qr-reader"></div>
    <div class="line-left"></div>
    <div class="line-right"></div>
    <div class="line-top"></div>
    <div class="line-bottom"></div>
    <div class="container"></div>
    <div id="qr-reader-results"></div>

    <div class="validation-result" id="validation-result"></div>

    <div id="manual-check-in" style="display: none;">
        <input class="manual-input" type="text" id="manual-ticket-id" placeholder="Enter Ticket ID" />
        <button class="manual-check" onclick="manualCheckIn()">MANUAL CHECK IN</button>
    </div>
    <button class="manual-check-toggle" id="manual-check-in-toggle" onclick="toggleManualCheckIn()">Manual
        Check-In</button>

    <button class="check-in" onclick="validateAndCheckInTicket()">CHECK IN</button>
</body>

</html>
