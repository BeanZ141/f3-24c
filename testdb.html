<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnostic Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;border-radius:0!important;font-family:'Space Grotesk',sans-serif}
        body{background-color:#131313;color:#ccc;margin:0;padding:20px;font-size:14px;line-height:1.5;height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center}
        h1,h2,h3{margin-top:0;font-weight:500;border-bottom:1px solid #e5e5e5;padding-bottom:10px;margin-bottom:15px;letter-spacing:-.5px}
        h1{font-size:24px}
        h2{font-size:18px;border-bottom:none;padding-bottom:0;margin-bottom:15px}
        .panel-header{border-bottom:1px solid #e5e5e5;padding-bottom:10px;margin-bottom:15px;display:flex;justify-content:space-between;align-items:center}
        .panel-header h2{border-bottom:none;padding-bottom:0;margin-bottom:0}
        button{background:#131313;color:#d8d8d8;border:1px solid #303030;padding:8px 16px;cursor:pointer;margin-right:10px;margin-bottom:10px;font-weight:500;transition:background-color 0.2s,border-color .2s}
        button:last-child{margin-right:0}
        button:hover{background:#383838;border-color:#3d3d3d}
        button:disabled{border-color:#2e2e2e;color:#999;cursor:not-allowed;background:#1d1d1d}
        .container{width:100%;height:100%;max-width:1920px;background-color:#0c0c0c;border:1px solid #3f3f3f;padding:30px;box-shadow:0 4px 12px #00000005;display:grid;grid-template-columns:350px 1fr 1fr;grid-template-rows:auto 1fr;gap:20px}
        .header-title{grid-column:1 / -1;margin-bottom:0;padding-bottom:20px}
        .controls-col{display:flex;flex-direction:column;gap:20px;overflow-y:auto}
        .panel{padding:20px;border:1px solid #2e2e2e;background:#131313}
        .table-tests{display:grid;grid-template-columns:1fr;gap:15px}
        .console-panel,.error-panel{display:flex;flex-direction:column;border:1px solid #3b3b3b;padding:20px;background:#111}
        .log-box{background:#181818;border:1px solid #424242;flex-grow:1;overflow-y:auto;padding:15px;white-space:pre-wrap;word-wrap:break-word;font-size:13px;margin:0;height:0}
        .error-box{background:#1a1a1a;border:1px solid #2c2c2c;color:#d32f2f;flex-grow:1;overflow-y:auto;padding:15px;white-space:pre-wrap;word-wrap:break-word;font-size:13px;margin:0;height:0}
        .test-result{margin-top:8px;min-height:40px;padding:10px;background:#1a1a1a;border:1px solid #292929;font-size:13px}
        .status-ok{color:#2e7d32;font-weight:500}
        .status-err{color:#d32f2f;font-weight:500}
        .status-wait{color:#f57c00;font-weight:500}
    </style>
</head>
<body>
    <div class="container">
        <h1 class="header-title">Diagnostic Dashboard</h1>
        
        <div class="controls-col">
            <div class="panel">
                <div class="panel-header">
                    <h2>Connection Status</h2>
                </div>
                <button id="btn-conn" onclick="testConnection()">Test Connection</button>
                <div id="conn-result" class="test-result">Waiting for test...</div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <h2>Table Access Tests</h2>
                </div>
                <div class="table-tests">
                    <div>
                        <button id="btn-flights" onclick="testTable('flights')">Test Flights</button>
                        <div id="res-flights" class="test-result">Waiting...</div>
                    </div>
                    <div>
                        <button id="btn-hotels" onclick="testTable('hotels')">Test Hotels</button>
                        <div id="res-hotels" class="test-result">Waiting...</div>
                    </div>
                    <div>
                        <button id="btn-trains" onclick="testTable('trains')">Test Trains</button>
                        <div id="res-trains" class="test-result">Waiting...</div>
                    </div>
                    <div>
                        <button id="btn-events" onclick="testTable('events')">Test Events</button>
                        <div id="res-events" class="test-result">Waiting...</div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="console-panel">
            <div class="panel-header">
                <h2>Console Output</h2>
                <div>
                    <button onclick="downloadLogs()" style="margin-bottom: 0;">Download Logs</button>
                    <button onclick="clearLogs()" style="margin-bottom: 0;">Clear Console</button>
                </div>
            </div>
            <div id="console-box" class="log-box"></div>
        </div>

        <div class="error-panel">
            <div class="panel-header" style="border-bottom-color: #ffdddd;">
                <h2 style="color: #d32f2f;">Error Stream</h2>
            </div>
            <div id="error-box" class="error-box"></div>
        </div>
    </div>

    <!-- Include Supabase and the Database script -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="public/js/database.js"></script>

    <script>
        const sessionLogs = [];

        // Override console methods to capture logs
        const originalConsoleLog = console.log;
        const originalConsoleError = console.error;
        const originalConsoleWarn = console.warn;
        const originalConsoleInfo = console.info;

        function appendToBox(boxId, message, type) {
            const box = document.getElementById(boxId);
            if (!box) return;
            const ts = new Date().toISOString();
            const msgStr = typeof message === 'object' ? JSON.stringify(message, null, 2) : String(message);
            const finalStr = `[${ts}] [${type}] ${msgStr}\n`;
            
            box.textContent += finalStr;
            box.scrollTop = box.scrollHeight;
            sessionLogs.push(finalStr);
        }

        console.log = function(...args) {
            originalConsoleLog.apply(console, args);
            appendToBox('console-box', args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' '), 'INFO');
        };
        
        console.info = function(...args) {
            originalConsoleInfo.apply(console, args);
            appendToBox('console-box', args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' '), 'INFO');
        };

        console.warn = function(...args) {
            originalConsoleWarn.apply(console, args);
            appendToBox('console-box', args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' '), 'WARN');
        };

        console.error = function(...args) {
            originalConsoleError.apply(console, args);
            const msg = args.map(a => {
                if (a && a instanceof Error) return a.stack || a.message;
                return typeof a === 'object' ? JSON.stringify(a) : a;
            }).join(' ');
            appendToBox('console-box', msg, 'ERROR');
            appendToBox('error-box', msg, 'ERROR');
        };

        // Global promise rejection handling
        window.addEventListener('unhandledrejection', function(event) {
            console.error('Unhandled Promise Rejection:', event.reason);
        });

        // Global error handling
        window.addEventListener('error', function(event) {
            console.error('Global Error:', event.error || event.message);
        });

        // Download functionality
        function downloadLogs() {
            if (sessionLogs.length === 0) {
                console.warn('No logs to download.');
                return;
            }
            const blob = new Blob([sessionLogs.join('')], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `session-logs-${new Date().toISOString().replace(/:/g, '-')}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            console.log('Logs downloaded successfully.');
        }

        function clearLogs() {
            document.getElementById('console-box').textContent = '';
            document.getElementById('error-box').textContent = '';
            sessionLogs.length = 0;
            console.log('Logs cleared.');
        }

        async function testConnection() {
            const btn = document.getElementById('btn-conn');
            const resBox = document.getElementById('conn-result');
            
            btn.disabled = true;
            resBox.innerHTML = '<span class="status-wait">Testing connection to Supabase backend...</span>';
            console.log('Initiating backend connection test...');
            
            try {
                // Time it out so we don't wait forever if it fails silently
                const waitPromise = DatabaseService.waitForSupabase();
                const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('Connection timeout after 5000ms')), 5000));
                
                await Promise.race([waitPromise, timeoutPromise]);

                if (window.supabaseClient) {
                    resBox.innerHTML = '<span class="status-ok">SUCCESS: Connected to backend. SupabaseClient initialized.</span>';
                    console.log('Backend connection validated.');
                } else {
                    throw new Error("supabaseClient is undefined after waiting.");
                }
            } catch (err) {
                console.error("Connection failed:", err);
                resBox.innerHTML = `<span class="status-err">ERROR: ${err.message}</span>`;
            } finally {
                btn.disabled = false;
            }
        }

        async function testTable(tableName) {
            const btn = document.getElementById(`btn-${tableName}`);
            const resBox = document.getElementById(`res-${tableName}`);
            
            btn.disabled = true;
            resBox.innerHTML = `<span class="status-wait">Testing read access for ${tableName}...</span>`;
            console.log(`Starting read access test for table: ${tableName}`);
            
            try {
                await DatabaseService.waitForSupabase();
                if (!window.supabaseClient) {
                    throw new Error("Supabase client not initialized.");
                }

                const { data, error } = await window.supabaseClient
                    .from(tableName)
                    .select('*')
                    .limit(5);

                if (error) {
                    throw error;
                }

                resBox.innerHTML = `<span class="status-ok">SUCCESS: Accessible. Retrieved ${data.length} rows.</span>`;
                console.log(`Table ${tableName} read successfully. Rows returned: ${data.length}`);
            } catch (err) {
                console.error(`Read error on table ${tableName}:`, err);
                resBox.innerHTML = `<span class="status-err">ERROR: ${err.message || err.code || 'Unknown error'}</span>`;
            } finally {
                btn.disabled = false;
            }
        }

        // Auto-initialize
        window.addEventListener('load', () => {
            console.log('Diagnostic Dashboard initialized.');
            console.log('Awaiting manual triggers for database tests.');
            
            // Optionally try to initialize early
            if (window.DatabaseService && typeof window.DatabaseService.waitForSupabase === 'function') {
                window.DatabaseService.waitForSupabase().catch(e => {
                    console.error("Initial backend wait failed:", e);
                });
            }
        });
    </script>
</body>
</html>
