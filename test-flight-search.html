<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Flight Search</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            margin: 5px;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background-color: #45a049;
        }
        .results {
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        .flight-item {
            padding: 10px;
            margin: 5px 0;
            background-color: #f5f5f5;
            border-radius: 4px;
        }
        .success { color: #155724; background-color: #d4edda; padding: 10px; border-radius: 4px; }
        .error { color: #721c24; background-color: #f8d7da; padding: 10px; border-radius: 4px; }
        .info { color: #0c5460; background-color: #d1ecf1; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Flight Search Test Page</h1>
    
    <div class="test-section">
        <h2>1. Test Database Connection</h2>
        <button onclick="testConnection()">Test Connection</button>
        <div id="connection-status"></div>
    </div>

    <div class="test-section">
        <h2>2. View All Flights</h2>
        <button onclick="getAllFlights()">Get All Flights</button>
        <div id="all-flights-status"></div>
        <div id="all-flights-results" class="results"></div>
    </div>

    <div class="test-section">
        <h2>3. Test Search Filters</h2>
        <button onclick="searchMumbaiToGoa()">Mumbai to Goa</button>
        <button onclick="searchDelhiToBangalore()">Delhi to Bangalore</button>
        <button onclick="searchByAirline('IndiGo')">IndiGo Flights</button>
        <button onclick="searchNonStop()">Non-Stop Only</button>
        <div id="search-status"></div>
        <div id="search-results" class="results"></div>
    </div>

    <script src="public/js/database.js"></script>
    <script>
        async function testConnection() {
            const statusDiv = document.getElementById('connection-status');
            statusDiv.className = 'info';
            statusDiv.innerHTML = 'Testing connection...';

            try {
                await DatabaseService.waitForSupabase();
                
                const { data, error } = await supabase
                    .from('flights')
                    .select('count');

                if (error) {
                    statusDiv.className = 'error';
                    statusDiv.innerHTML = `Connection failed: ${error.message}`;
                } else {
                    statusDiv.className = 'success';
                    statusDiv.innerHTML = 'Connection successful! Database is accessible.';
                }
            } catch (error) {
                statusDiv.className = 'error';
                statusDiv.innerHTML = `Error: ${error.message}`;
            }
        }

        async function getAllFlights() {
            const statusDiv = document.getElementById('all-flights-status');
            const resultsDiv = document.getElementById('all-flights-results');
            
            statusDiv.className = 'info';
            statusDiv.innerHTML = 'Fetching all flights...';
            resultsDiv.innerHTML = '';

            try {
                const flights = await DatabaseService.getFlights();
                
                if (flights.length === 0) {
                    statusDiv.className = 'error';
                    statusDiv.innerHTML = 'No flights found in database. Please import data first.';
                } else {
                    statusDiv.className = 'success';
                    statusDiv.innerHTML = `Found ${flights.length} flights in database`;
                    
                    resultsDiv.innerHTML = flights.map(flight => `
                        <div class="flight-item">
                            <strong>${flight.company} ${flight.flight_number}</strong><br>
                            ${flight.boarding_airport} → ${flight.landing_airport} | 
                            ${flight.boarding} - ${flight.landing} | 
                            ${flight.duration} | ${flight.stop} | ${flight.cost}
                        </div>
                    `).join('');
                }
            } catch (error) {
                statusDiv.className = 'error';
                statusDiv.innerHTML = `Error: ${error.message}`;
            }
        }

        async function searchMumbaiToGoa() {
            await searchFlights({ from: 'BOM', to: 'GOI' }, 'Mumbai (BOM) to Goa (GOI)');
        }

        async function searchDelhiToBangalore() {
            await searchFlights({ from: 'DEL', to: 'BLR' }, 'Delhi (DEL) to Bangalore (BLR)');
        }

        async function searchByAirline(airline) {
            await searchFlights({ airline: [airline] }, `${airline} flights`);
        }

        async function searchNonStop() {
            await searchFlights({ stops: ['Non-Stop'] }, 'Non-Stop flights');
        }

        async function searchFlights(filters, description) {
            const statusDiv = document.getElementById('search-status');
            const resultsDiv = document.getElementById('search-results');
            
            statusDiv.className = 'info';
            statusDiv.innerHTML = `Searching for ${description}...`;
            resultsDiv.innerHTML = '';

            try {
                const flights = await DatabaseService.getFlights(filters);
                
                if (flights.length === 0) {
                    statusDiv.className = 'error';
                    statusDiv.innerHTML = `No flights found for ${description}`;
                } else {
                    statusDiv.className = 'success';
                    statusDiv.innerHTML = `Found ${flights.length} flights for ${description}`;
                    
                    resultsDiv.innerHTML = flights.map(flight => `
                        <div class="flight-item">
                            <strong>${flight.company} ${flight.flight_number}</strong><br>
                            ${flight.boarding_airport} → ${flight.landing_airport} | 
                            ${flight.boarding} - ${flight.landing} | 
                            ${flight.duration} | ${flight.stop} | ${flight.cost}
                        </div>
                    `).join('');
                }
            } catch (error) {
                statusDiv.className = 'error';
                statusDiv.innerHTML = `Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
