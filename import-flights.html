        async function importFlights() {
            const statusDiv = document.getElementById('status');
            statusDiv.className = 'info';
            statusDiv.innerHTML = 'Importing flights data...';

            try {
                await DatabaseService.waitForSupabase();

                // First, check if table exists and has data
                const { data: existingData, error: checkError } = await supabase
                    .from('flights')
                    .select('*')
                    .limit(1);

                if (checkError) {
                    statusDiv.className = 'error';
                    statusDiv.innerHTML = `Error: ${checkError.message}<br>Make sure the 'flights' table exists in Supabase.`;
                    return;
                }

                // Delete existing data
                const { error: deleteError } = await supabase
                    .from('flights')
                    .delete()
                    .neq('id', 0); // Delete all rows

                if (deleteError) {
                    console.warn('Could not delete existing data:', deleteError);
                }

                // Insert new data
                const { data, error } = await supabase
                    .from('flights')
                    .insert(flightsData);

                if (error) {
                    statusDiv.className = 'error';
                    statusDiv.innerHTML = `Error importing data: ${error.message}`;
                    console.error('Import error:', error);
                } else {
                    statusDiv.className = 'success';
                    statusDiv.innerHTML = `Successfully imported ${flightsData.length} flights!<br>You can now close this page and search for flights.`;

                }
            } catch (error) {
